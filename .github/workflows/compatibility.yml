name: Release compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-compatibility
  cancel-in-progress: false

jobs:
  package-lifecycle:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    env:
      BURNERFORM_LIFECYCLE_URL: https://burnerform.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package-candidates
      - run: pnpm packages:candidate-check
      - run: pnpm recovery:lifecycle
      - run: pnpm mcp:lifecycle
