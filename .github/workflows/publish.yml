name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.13.0
      - run: pnpm install --frozen-lockfile
      - name: Verify coordinated version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const expected = process.env.RELEASE_TAG.replace(/^v/u, "");
          const packages = ["core", "sdk", "mcp"];
          for (const name of packages) {
            const manifest = JSON.parse(
              readFileSync(`packages/${name}/package.json`, "utf8"),
            );
            if (manifest.version !== expected) {
              throw new Error(
                `${manifest.name} is ${manifest.version}, expected ${expected}`,
              );
            }
          }
          NODE
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm docs:check
      - run: pnpm conformance
      - run: pnpm packages:check
      - run: pnpm skill:check
      - run: pnpm mcp:smoke
      - run: pnpm build:package-candidates
      - run: pnpm packages:candidate-check
      - name: Publish coordinated packages
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          npm publish "./artifacts/npm/burnerform-core-${version}.tgz" --access public --provenance
          npm publish "./artifacts/npm/burnerform-sdk-${version}.tgz" --access public --provenance
          npm publish "./artifacts/npm/burnerform-mcp-${version}.tgz" --access public --provenance
